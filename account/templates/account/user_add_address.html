{% extends 'base.html' %}
{% load static %}
{% block content %}

    <div class="container">
        <h3 style="text-align: center"> Ajouter une nouvelle addresse</h3>
        {% if error %}
            <p style="color:red;"> Une adresse avec ce nom existe déjà</p>
        {% endif %}
       <form action="" method="post">
           {% csrf_token %}
           {{ form }}
           <button class="btn btn-info"> Submit </button>
       </form>

    </div>

{% endblock %}
