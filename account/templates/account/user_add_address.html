{% extends 'base.html' %}
{% load static %}
{% block content %}
    <div class="container">
        <main>
            <div class="py-2 text-center">
                <h2>New address</h2>
                <p class="lead">
                    Add new address to your account.
                </p>
            </div>
            <div class="row">
                <div class="col-auto mx-auto">
                    <form class="needs-validation" method="POST" novalidate>
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-12">
                                <label class="form-label">Address</label>
                                <input type="text" name="name"
                                       class="form-control {% if error %} is-invalid {% endif %}" id="name"
                                       placeholder="57 High Rd" autocomplete="off"
                                       required>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label">City</label>
                                <input type="text" name="city" class="form-control" id="city" placeholder="Bushey"
                                       autocomplete="off" required>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label">Postal Code</label>
                                <input type="number" name="postal_code" class="form-control {% if error_postal %} is-invalid {% endif %}"
                                       id="postal_code"
                                       placeholder="WD23-1EE" autocomplete="off" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Address 2 <span
                                        class="text-muted">(Optional)</span></label>
                                <input type="text" name="address_complement" class="form-control"
                                       id="address_complement" autocomplete="off" placeholder="Apartment 432">
                            </div>
                        </div>
                        {% if error %}
                            <div class="mx-auto text-center my-1">
                                <p class="error"> This address already exists.</p>
                            </div>
                        {% endif %}
                        {% if error_postal %}
                            <div class="mx-auto text-center my-1">
                                <p class="error"> Postal isn't 5 caracters long.</p>
                            </div>
                        {% endif %}
                        <hr class="my-4">
                        <div class="col-auto mx-auto text-center">
                            <button class="w-25 btn btn-primary btn-sm" type="submit">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
{% endblock %}
