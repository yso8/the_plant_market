{% extends 'base.html' %}
{% block content %}

<div class="container">
    <div class="">
        <h3> My favorite products </h3>
        <div>
            {% for favorite in favorites %}
                <div class="card mt-4">
                    <a href="{% url 'product_detail' favorite.slug %}">{{ favorite }}</a>
                    <img src="{{ favorite.picture.url }}" alt="{{ favorite }}">
                </div>
            {% endfor %}
        </div>
    </div>

    <div class="row text-center">
        {% for favorite in favorites %}
        <div class="col-auto col-lg-auto mx-auto">
            <a href="{% url 'product_detail' favorite.slug %}">
                <img class="bd-placeholder-img rounded-circle" width="140" height="140" src="{{ favorite.picture.url }}"
                     role="img">
            </a>
            <h6>{{ favorite.name }}</h6>
        </div>
        {% endfor %}
    </div>


</div>

{% endblock %}
